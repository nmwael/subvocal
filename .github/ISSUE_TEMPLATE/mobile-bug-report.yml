name: 📱 Mobile Bug Report
description: Report a crash, glitch, or unexpected behavior in the mobile application.
title: "[Bug]: "
labels: ["mobile-app", "bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this issue! Please provide as much detail as possible to help us reproduce and resolve the bug.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g., The app freezes completely when navigating to the checkout screen..."
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - iOS
        - Android
        - iPadOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App & OS Version
      placeholder: "e.g., App v1.0.0 / iOS 17.4"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Tell us exactly how you triggered the issue.
      placeholder: |
        1. Open the application.
        2. Search for subtitles.
        3. Tap on a result.
        4. Observe the crash.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 📋 Application Console Logs
      description: Diagnostic system logs captured by the mobile client at the time of the event.
      render: text
      placeholder: "[System logs will be populated automatically here]"
    validations:
      required: false
