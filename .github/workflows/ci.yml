name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'android/**'
              - 'ios/**'
            integration:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'android/**'
              - 'ios/**'

  analyze-and-test:
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: flutter test --machine 2>/dev/null | grep '^{' > test-results.json

      - name: Upload test report
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results.json

      - name: Unit Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Flutter Unit Tests
          path: test-results.json
          reporter: flutter-json
          use-actions-summary: false
          fail-on-error: false

  integration-test:
    needs: [changes, analyze-and-test]
    if: |
      needs.changes.outputs.integration == 'true' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Cache Android emulator
        uses: actions/cache@v6
        with:
          path: ~/.android/avd
          key: ${{ runner.os }}-avd-${{ hashFiles('**/pubspec.yaml') }}-${{ hashFiles('**/integration_test/**') }}
          restore-keys: |
            ${{ runner.os }}-avd-

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-load -no-snapshot-save
          disable-animations: true
          emulator-boot-timeout: 180
          script: |
            adb logcat -c
            flutter test integration_test/ --machine --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=AZURE_TRANSLATION_KEY=${{ secrets.AZURE_TRANSLATION_KEY }} --dart-define=AZURE_TRANSLATION_REGION=${{ secrets.AZURE_TRANSLATION_REGION }} 2>/dev/null | grep '^{' > integration-results.json || true
            python3 scripts/extract_screenshots.py || true

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-screenshots
          path: screenshots/

      - name: Upload integration test report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-results
          path: integration-results.json

      - name: Integration Test Report
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Flutter Integration Tests
          path: integration-results.json
          reporter: flutter-json
          use-actions-summary: false
          fail-on-error: false

  ci-pass:
    if: always()
    needs: [analyze-and-test, integration-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "analyze-and-test: ${{ needs.analyze-and-test.result }}"
          echo "integration-test: ${{ needs.integration-test.result }}"
          if [[ "${{ needs.analyze-and-test.result }}" == "failure" ]]; then
            echo "analyze-and-test failed"
            exit 1
          fi
          if [[ "${{ needs.integration-test.result }}" == "failure" ]]; then
            echo "integration-test failed"
            exit 1
          fi
          echo "All required checks passed"
