name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Get version
        id: version
        run: |
          FULL_VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
          SEMVER=$(echo "$FULL_VERSION" | sed 's/+.*//')
          BUILD=$(echo "$FULL_VERSION" | sed 's/.*+//')
          echo "VERSION=$SEMVER" >> $GITHUB_ENV
          echo "FULL_VERSION=$FULL_VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

      - name: Build APK
        run: flutter build apk --release --dart-define=AZURE_TRANSLATION_KEY=${{ secrets.AZURE_TRANSLATION_KEY }} --dart-define=AZURE_TRANSLATION_REGION=${{ secrets.AZURE_TRANSLATION_REGION }}

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/subvocal-${{ env.VERSION }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: subvocal-release-apk
          path: build/app/outputs/flutter-apk/subvocal-${{ env.VERSION }}.apk
          retention-days: 30

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}+${{ env.BUILD }}
          name: Release v${{ env.VERSION }}+${{ env.BUILD }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/app/outputs/flutter-apk/subvocal-${{ env.VERSION }}.apk
